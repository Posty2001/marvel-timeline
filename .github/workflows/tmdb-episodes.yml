name: TMDB episodi (manuale)

# Solo avvio manuale. Non modifica il repository, non fa deploy, non tocca Firebase.
# Risultato: artifact scaricabile "tmdb-episodes" (assets/episodes/*.json) da copiare nella build TEST.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica presenza del secret (senza stamparlo)
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Nessun secret trovato (TMDB_READ_TOKEN o TMDB_API_KEY)."
            exit 1
          fi
      - name: Genera il catalogo episodi
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/tmdb_episodes.py
      - uses: actions/upload-artifact@v4
        with:
          name: tmdb-episodes
          path: assets/episodes/
          if-no-files-found: error
          retention-days: 30
