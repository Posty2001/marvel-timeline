name: TMDB sync (manuale)

# Nome del run: se avviato dallo scheduler porta l identificativo di correlazione (il run si ritrova senza ambiguita).
run-name: ${{ startsWith(inputs.dispatch_id, 'mm-') && format('Miss Minutes archivio {0}', inputs.dispatch_id) || (inputs.dispatch_id != '' && format('TVA Live update {0}', inputs.dispatch_id)) || github.workflow }}

# Solo avvio manuale. Non modifica il repository, non fa deploy, non tocca Firebase.
# Risultati: artifact scaricabile "tmdb-sync" (tmdb_map.json + tmdb_review.json).
# TVA Live: solo_live_build=true genera calendar/trailers/manifest.json (artifact tva-live-data, nessun commit).
# TVA Live 1.1: con solo_live_build=true e live_commit=true il job live-update aggiorna i dati in assets/live/ SOLO sul branch
#   test/tva-archives (commit dei soli 4 file di dati, solo se cambiano o per la verifica settimanale). NON pubblica su Netlify, NON tocca main.
#   Si avvia da un repository scheduler separato (docs/TVA_LIVE_AUTOMATION.md) oppure a mano. Va lanciato con ref test/tva-archives.
# Miss Minutes 2.0 (solo TEST): con mm_tmdb=true genera l archivio TMDB dei titoli (tools/mm_tmdb.py, artifact mm-tmdb); con mm_tmdb_commit scrive SOLO
#   miss-minutes/knowledge/tmdb_titoli.json su test/tva-archives. Va lanciato con ref test/tva-archives; non tocca main, TVA Live ed Episodes.
# TVA Live Fase 0: con solo_live_probe=true esegue solo la sonda di lettura (tools/live_probe.py) e produce l artifact "live-probe".
on:
  workflow_dispatch:
    inputs:
      solo_episodi:
        description: Genera solo il catalogo episodi (senza rifare l abbinamento delle locandine)
        type: boolean
        default: true
      solo_live_probe:
        description: TVA Live Fase 0 - esegui SOLO la sonda in lettura sulle fonti (artifact live-probe) e salta il resto
        type: boolean
        default: false
      solo_live_build:
        description: TVA Live - genera i JSON statici (calendario, trailer, manifest) e salta il resto (artifact tva-live-data, nessun commit)
        type: boolean
        default: false
      live_commit:
        description: TVA Live 1.1 - con solo_live_build, aggiorna assets/live sul branch test/tva-archives se i dati validi sono cambiati (nessun deploy)
        type: boolean
        default: false
      live_force:
        description: TVA Live 1.1 - supera le soglie anti-anomalia (mai i controlli su fonti, schema e sicurezza)
        type: boolean
        default: false
      live_dry_run:
        description: TVA Live 1.1 - prova a secco con live_commit - esegue tutti i controlli ma non scrive e non fa commit
        type: boolean
        default: false
      dispatch_id:
        description: TVA Live 1.1 - identificativo di correlazione impostato dallo scheduler (lasciare vuoto a mano)
        type: string
        default: ''
      solo_atlante_pilot:
        description: Atlante A3.1 pilota - genera i CANDIDATI di scena TMDB (solo metadati, nessuna immagine) per 10 identita e salta il resto; con atlante_pilot_commit scrive solo atlante2/data/pilot/candidati.json su test/tva-archives
        type: boolean
        default: false
      atlante_job:
        description: Atlante A3.1 - lavori di sola lettura/metadati sul branch TEST - verifica_mappa (tmdbMap contro TMDB) oppure presel (preselezione scene sperimentale); lascia vuoto per il resto
        type: string
        default: ''
      atlante_pilot_commit:
        description: Atlante A3.1 pilota - con solo_atlante_pilot, committa il solo candidati.json (e il report) su test/tva-archives
        type: boolean
        default: true
      mm_tmdb:
        description: Miss Minutes 2.0 - genera SOLO l archivio TMDB dei titoli (sinossi, regia, cast, date per paese; artifact mm-tmdb) e salta il resto
        type: boolean
        default: false
      mm_tmdb_commit:
        description: Miss Minutes 2.0 - con mm_tmdb, scrive il solo tmdb_titoli.json su test/tva-archives (mai su main)
        type: boolean
        default: false
      db_censimento:
        description: Database Expansion W0 - censimento in SOLA LETTURA (conteggi interni + Wikidata/TMDB/Comic Vine se la chiave c e; artifact db-censimento, nessun commit) e salta il resto
        type: boolean
        default: false
      db_w1b:
        description: Database Expansion W1.b - raccolta di FATTI da MCU Wiki e Marvel Database (Fandom, API MediaWiki, CC BY-SA 3.0, solo fatti strutturati) per le voci in staging; scrive SOLO sul branch dati db-raw
        type: boolean
        default: false
      db_w2:
        description: Database Expansion W2 - raccolta Wikidata (CC0) dei film Marvel pre-MCU e paralleli (Fox, Raimi, Garfield, SSU, Blade, Daredevil/Elektra, Ghost Rider, Hulk 2003, Fantastici Quattro); scrive SOLO sul branch dati db-raw
        type: boolean
        default: false
      db_w3:
        description: 'DB Expansion W3 - serie TV e film live-action non MCU (raccolta Wikidata, branch db-raw)'
        type: boolean
        default: false
      db_w4:
        description: 'DB Expansion W4 - animazione (raccolta Wikidata, branch db-raw)'
        type: boolean
        default: false
      db_w5:
        description: 'DB Expansion W5 - fumetti Marvel: entita narrative (raccolta Wikidata, branch db-raw)'
        type: boolean
        default: false
      db_w5c:
        description: 'DB Expansion W5.c - fumetti Marvel: ranking e ID da Comic Vine (richiede il Secret gratuito COMICVINE_API_KEY; branch db-raw)'
        type: boolean
        default: false
      db_cvmd:
        description: 'CV-MD: pagine Marvel Database per le voci Comic Vine'
        type: boolean
        default: false
      db_w5b:
        description: 'DB Expansion W5.b - fumetti Marvel: fatti da Marvel Database (CC BY-SA, solo fatti; branch db-raw)'
        type: boolean
        default: false
      db_w6:
        description: 'DB Expansion W6 - fumetti Marvel: opere, saghe e creatori (raccolta Wikidata, branch db-raw)'
        type: boolean
        default: false
      db_relv:
        description: 'DB Expansion - seconda fonte Wikipedia (solo esito) per le relazioni narrative (branch db-raw)'
        type: boolean
        default: false
      db_rel:
        description: 'DB Expansion - relazioni narrative documentate da Wikidata (branch db-raw)'
        type: boolean
        default: false
      live_recover_from:
        description: TVA Live RECUPERO di emergenza - SHA di un commit precedente di questo branch con un catalogo valido; con live_commit lo ripristina con generated_at nuovo (senza TMDB)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sync:
    if: ${{ !inputs.db_censimento && !inputs.db_w1 && !inputs.db_w1b && !inputs.db_w2 && !inputs.db_w3 && !inputs.db_w4 && !inputs.db_w5 && !inputs.db_w5b && !inputs.db_cvmd && !inputs.db_w5c && !inputs.db_relv && !inputs.db_w6 && !inputs.db_rel && !inputs.mm_tmdb && !inputs.solo_atlante_pilot && inputs.atlante_job == '' && !((inputs.solo_live_build || inputs.live_recover_from != '') && inputs.live_commit) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifica presenza del secret (senza stamparlo)
        if: ${{ inputs.live_recover_from == '' }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Nessun secret trovato. Aggiungi TMDB_READ_TOKEN (consigliato) o TMDB_API_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secret presente."

      - name: Sincronizza con TMDB
        if: ${{ !inputs.solo_episodi && !inputs.solo_live_probe && !inputs.solo_live_build }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/tmdb_sync.py

      - name: Genera catalogo episodi (TVA Episodes)
        if: ${{ !inputs.solo_live_probe && !inputs.solo_live_build }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/tmdb_episodes.py

      - name: TVA Live Fase 0 - sonda fonti (sola lettura)
        if: ${{ inputs.solo_live_probe }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/live_probe.py --out live-probe-out

      - name: Riepilogo sonda nel job
        if: ${{ always() && inputs.solo_live_probe }}
        run: |
          if [ -f live-probe-out/REPORT.md ]; then cat live-probe-out/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Salva i risultati della sonda
        if: ${{ always() && inputs.solo_live_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: live-probe
          path: live-probe-out/
          if-no-files-found: warn
          retention-days: 30

      - name: TVA Live - genera i JSON statici
        if: ${{ inputs.solo_live_build }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/tva_live_build.py --out live-data --prev assets/live

      - name: Riepilogo TVA Live nel job
        if: ${{ always() && inputs.solo_live_build }}
        run: |
          if [ -f live-data/REPORT.md ]; then cat live-data/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Salva i JSON TVA Live
        if: ${{ always() && inputs.solo_live_build }}
        uses: actions/upload-artifact@v4
        with:
          name: tva-live-data
          path: live-data/
          if-no-files-found: warn
          retention-days: 30

      - name: Salva i risultati
        if: ${{ !inputs.solo_live_probe && !inputs.solo_live_build }}
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-sync
          path: |
            assets/images/catalog/tmdb_map.json
            assets/images/catalog/tmdb_review.json
            assets/episodes/
          if-no-files-found: error
          retention-days: 30

  live-update:
    # Aggiornamento automatico del CATALOGO (solo dati). Pubblicazione dell app = operazione separata.
    if: ${{ !inputs.db_censimento && !inputs.db_w1 && !inputs.db_w1b && !inputs.db_w2 && !inputs.db_w3 && !inputs.db_w4 && !inputs.db_rel && !inputs.mm_tmdb && !inputs.solo_atlante_pilot && inputs.atlante_job == '' && (inputs.solo_live_build || inputs.live_recover_from != '') && inputs.live_commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # minimo necessario per il push dei soli dati; nessun altro permesso
    concurrency:
      group: tva-live-update
      cancel-in-progress: false
    steps:
      - name: Verifica che il workflow giri sul branch TEST
        run: |
          if [ "$GITHUB_REF" != "refs/heads/test/tva-archives" ]; then
            echo "::error::live_commit e consentito solo con ref test/tva-archives (ref attuale: $GITHUB_REF)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: test/tva-archives
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifica presenza del secret (senza stamparlo)
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Nessun secret TMDB trovato."
            exit 1
          fi

      - name: RECUPERO - ripristina un catalogo noto e valido (solo se richiesto)
        id: rec
        if: ${{ inputs.live_recover_from != '' }}
        env:
          REC_SHA: ${{ inputs.live_recover_from }}
          LIVE_DRY: ${{ inputs.live_dry_run }}
        run: |
          args=(--from "$REC_SHA" --out live-update-out --github-output "$GITHUB_OUTPUT")
          if [ "$LIVE_DRY" = "true" ]; then args+=(--dry-run); fi
          python3 tools/live_recover.py "${args[@]}"

      - name: Genera, valida e decidi (nessuna scrittura se rifiutato o invariato)
        id: upd
        if: ${{ inputs.live_recover_from == '' }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LIVE_FORCE: ${{ inputs.live_force }}
          LIVE_DRY: ${{ inputs.live_dry_run }}
        run: |
          args=(--out live-update-out --github-output "$GITHUB_OUTPUT")
          if [ "$LIVE_FORCE" = "true" ]; then args+=(--force); fi
          if [ "$LIVE_DRY" = "true" ]; then args+=(--dry-run); fi
          python3 tools/live_update.py "${args[@]}"

      - name: Riepilogo nel job
        if: ${{ always() }}
        run: |
          if [ -f live-update-out/SUMMARY.md ]; then cat live-update-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit dei soli dati su test/tva-archives
        if: ${{ !inputs.live_dry_run && (steps.upd.outputs.result == 'update' || steps.upd.outputs.result == 'heartbeat' || steps.rec.outputs.result == 'recovery') }}
        run: bash tools/live_git_commit.sh live-update-out/COMMIT_MSG.txt origin

      - name: Salva candidato, report e (se rifiutato) i dati bloccati
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tva-live-update
          path: live-update-out/
          if-no-files-found: warn
          retention-days: 30

  atlante-pilot:
    # Atlante A3.1 pilota: SOLO metadati (percorsi CDN, dimensioni, voti). La chiave resta nei Secret, mai nell output ne nel frontend.
    if: ${{ !inputs.db_censimento && !inputs.db_w1 && !inputs.db_w1b && !inputs.db_w2 && !inputs.db_w3 && !inputs.db_w4 && !inputs.db_rel && !inputs.mm_tmdb && (inputs.solo_atlante_pilot || (inputs.atlante_job != '' && !startsWith(inputs.atlante_job, 'engine'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # solo per il commit del file candidati.json su test/tva-archives
    concurrency:
      group: atlante-pilot
      cancel-in-progress: false
    steps:
      - name: Solo branch TEST
        run: |
          if [ "$GITHUB_REF" != "refs/heads/test/tva-archives" ]; then
            echo "::error::Consentito solo con ref test/tva-archives (ref attuale: $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: test/tva-archives
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica presenza del secret (senza stamparlo)
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Nessun secret TMDB trovato."
            exit 1
          fi
          echo "Secret presente."
      - name: Genera candidati (solo metadati)
        if: ${{ inputs.solo_atlante_pilot }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/atlante_pilot_tmdb.py --out pilot-out
      - name: Candidati ondata 1 (solo metadati, 30 identità nuove)
        if: ${{ inputs.atlante_job == 'w1_candidati' }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/atlante_w.py --candidati --out w1-out
      - name: Candidati di tutte le identità (solo metadati, riprendibile)
        if: ${{ inputs.atlante_job == 'tutti_candidati' }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/atlante_w.py --candidati-all --out w1-out
      - name: Verifica mappa locandine contro TMDB (sola lettura)
        if: ${{ inputs.atlante_job == 'verifica_mappa' }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/tmdb_verifica_mappa.py --out pilot-out
      - name: Riepilogo nel job
        if: ${{ always() }}
        run: |
          if [ -f pilot-out/REPORT.md ]; then cat pilot-out/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Salva artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: atlante-pilot
          path: pilot-out/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit dei soli file di metadati su test/tva-archives
        if: ${{ inputs.atlante_pilot_commit }}
        run: |
          ALLOWED="atlante2/data/pilot/candidati.json docs/ATLANTE_2_0_A31_PILOTA_CANDIDATI_REPORT.md data/atlante/tmdb_verifica_mappa.json docs/ATLANTE_2_0_TMDB_VERIFICA_MAPPA.md"
          if [ -f pilot-out/candidati.json ]; then
            mkdir -p atlante2/data/pilot
            cp pilot-out/candidati.json atlante2/data/pilot/candidati.json
            cp pilot-out/REPORT.md docs/ATLANTE_2_0_A31_PILOTA_CANDIDATI_REPORT.md
          fi
          if [ -f pilot-out/verifica_mappa.json ]; then
            cp pilot-out/verifica_mappa.json data/atlante/tmdb_verifica_mappa.json
            cp pilot-out/VERIFICA_MAPPA.md docs/ATLANTE_2_0_TMDB_VERIFICA_MAPPA.md
          fi
          if [ -d w1-out ]; then mkdir -p atlante2/data/pilot/c; for f in w1-out/*.json; do cp "$f" atlante2/data/pilot/c/; done; git add -- atlante2/data/pilot/c; fi
          git add -- $(for f in $ALLOWED; do [ -f "$f" ] && echo "$f"; done)
          if git diff --cached --quiet; then echo "Nessuna modifica."; exit 0; fi
          extra="$(git diff --cached --name-only | grep -v '^atlante2/data/pilot/c/' | grep -vxF -f <(printf '%s\n' $ALLOWED) || true)"
          [ -z "$extra" ] || { echo "File non consentiti: $extra"; exit 4; }
          git -c user.name="tva-pilot-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "data(A3.1): metadati di verifica/pilota TMDB (solo metadati)"
          for i in 1 2 3; do
            git pull -q --rebase origin test/tva-archives || true
            if git push -q origin HEAD:refs/heads/test/tva-archives; then echo "Pubblicato (solo metadati)."; exit 0; fi
            sleep 3
          done
          exit 5

  mm-tmdb:
    # Miss Minutes 2.0: archivio TMDB dei titoli (dati pubblici, 0 EUR). La chiave resta nei Secret. Solo branch TEST; mai main.
    if: ${{ inputs.mm_tmdb && !inputs.db_censimento && !inputs.db_w1 && !inputs.db_w1b && !inputs.db_w2 && !inputs.db_w3 && !inputs.db_w4 && !inputs.db_rel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # solo per il commit del file tmdb_titoli.json su test/tva-archives (se mm_tmdb_commit)
    concurrency:
      group: mm-tmdb
      cancel-in-progress: false
    steps:
      - name: Solo branch TEST
        run: |
          if [ "$GITHUB_REF" != "refs/heads/test/tva-archives" ]; then
            echo "::error::Consentito solo con ref test/tva-archives (ref attuale: $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: test/tva-archives
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genera l archivio TMDB (senza stampare il secret)
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then echo "::error::Nessun secret TMDB trovato."; exit 1; fi
          python3 tools/mm_tmdb.py --prova
          python3 tools/mm_tmdb.py --scrivi
          python3 tools/mm_tmdb.py --verifica
          python3 tools/mm_tmdb.py --copertura | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salva artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mm-tmdb
          path: |
            miss-minutes/knowledge/tmdb_titoli.json
            miss-minutes/knowledge/tmdb_risolti.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit del solo tmdb_titoli.json su test/tva-archives
        if: ${{ inputs.mm_tmdb_commit }}
        run: |
          git add -- miss-minutes/knowledge/tmdb_titoli.json miss-minutes/knowledge/tmdb_risolti.json
          if git diff --cached --quiet; then echo "Nessuna modifica."; exit 0; fi
          extra="$(git diff --cached --name-only | grep -vxE 'miss-minutes/knowledge/tmdb_(titoli|risolti).json' || true)"
          [ -z "$extra" ] || { echo "File non consentiti: $extra"; exit 4; }
          git -c user.name="tva-mm-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "data(Miss Minutes 2.0): archivio TMDB dei titoli (solo dati pubblici)"
          for i in 1 2 3; do
            git pull -q --rebase origin test/tva-archives || true
            if git push -q origin HEAD:refs/heads/test/tva-archives; then echo "Pubblicato."; exit 0; fi
            sleep 3
          done
          exit 5

  atlante-engine:
    # A3.2 Visual Asset Engine (prototipo, 10 identità): CLIP/SigLIP su CPU del runner (gratuito). Solo metadati in uscita; le immagini restano nel runner.
    # atlante_job = engine-clip | engine-siglip | engine-smoke
    if: ${{ !inputs.db_censimento && !inputs.db_w1 && !inputs.db_w1b && !inputs.db_w2 && !inputs.db_w3 && !inputs.db_w4 && !inputs.db_rel && !inputs.mm_tmdb && startsWith(inputs.atlante_job, 'engine') }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: write
    concurrency:
      group: atlante-engine
      cancel-in-progress: false
    steps:
      - name: Solo branch TEST
        run: |
          if [ "$GITHUB_REF" != "refs/heads/test/tva-archives" ]; then echo "::error::Consentito solo con ref test/tva-archives."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: test/tva-archives
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze (CPU, gratuite)
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet open_clip_torch timm transformers sentencepiece protobuf pillow numpy requests
      - name: Motore
        run: |
          set -o pipefail
          MODE="${{ inputs.atlante_job }}"
          if [ "$MODE" = "engine2-tutte" ] || [ "$MODE" = "engine2-tutte-smoke" ]; then \
            A2="--tutte --budget-min 95"; [ "$MODE" = "engine2-tutte-smoke" ] && A2="--tutte --smoke"; \
            /usr/bin/time -v python3 tools/atlante_engine2.py $A2 --out engine-out 2> engine-out-time.txt || { tail -30 engine-out-time.txt; exit 1; }; \
            mkdir -p engine-out; cp engine-out-time.txt engine-out/time.txt; exit 0; fi
          if [ "$MODE" = "engine2" ] || [ "$MODE" = "engine2-smoke" ]; then \
            A2=""; [ "$MODE" = "engine2-smoke" ] && A2="--smoke"; \
            /usr/bin/time -v python3 tools/atlante_engine2.py $A2 --out engine-out 2> engine-out-time.txt || { tail -30 engine-out-time.txt; exit 1; }; \
            mkdir -p engine-out; cp engine-out-time.txt engine-out/time.txt; exit 0; fi
          if [ "$MODE" = "engine-smoke" ]; then ARGS="--modello clip --max-per-identita 8 --sheet"; \
          elif [ "$MODE" = "engine-siglip" ]; then ARGS="--modello siglip --sheet"; \
          elif [ "$MODE" = "engine-clip" ]; then ARGS="--modello clip --sheet"; \
          else ARGS="--modello clip --sheet"; fi
          /usr/bin/time -v python3 tools/atlante_engine.py $ARGS --out engine-out 2> engine-out-time.txt || { tail -30 engine-out-time.txt; exit 1; }
          mkdir -p engine-out; cp engine-out-time.txt engine-out/time.txt
      - name: Salva artifact (miniature solo per valutazione, retention 1 giorno)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: atlante-engine
          path: engine-out/
          if-no-files-found: warn
          retention-days: 1
      - name: Commit dei soli metadati
        if: ${{ always() && inputs.atlante_pilot_commit }}
        run: |
          mkdir -p data/atlante/engine
          if [ -d engine-out/blocchi ] && [ "${{ inputs.atlante_job }}" != "engine2-tutte-smoke" ]; then mkdir -p data/atlante/engine/blocchi; cp engine-out/blocchi/*.json data/atlante/engine/blocchi/ 2>/dev/null || true; fi
          for f in engine-out/proposte*.json engine-out/metriche*.json; do [ -f "$f" ] && cp "$f" data/atlante/engine/; done
          git add -- data/atlante/engine
          if git diff --cached --quiet; then echo "Nessuna modifica."; exit 0; fi
          extra="$(git diff --cached --name-only | grep -v '^data/atlante/engine/' || true)"
          [ -z "$extra" ] || { echo "File non consentiti: $extra"; exit 4; }
          git -c user.name="tva-pilot-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "data(A3.2): proposte e metriche del motore (solo metadati)"
          for i in 1 2 3; do
            git pull -q --rebase origin test/tva-archives || true
            if git push -q origin HEAD:refs/heads/test/tva-archives; then echo "Pubblicato (solo metadati)."; exit 0; fi
            sleep 3
          done
          exit 5

