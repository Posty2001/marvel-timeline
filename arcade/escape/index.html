 'ripristina-collegamento':{clue:'Per chiudere il circuito servono: ciò che conduce, ciò che alimenta, ciò che emette.',decoys:['fusibile','antenna'],sym:{cavo:'〰 Cavo',batteria:'🔋 Batteria',trasmettitore:'📡 Trasmettitore',fusibile:'▭ Fusibile',antenna:'⟟ Antenna'}},
 'decifra-trasmissione':{clue:'Il segnale ripete un nome di quattro lettere, con due lettere uguali al centro. La prima è la quarta lettera dell’alfabeto, l’ultima la tredicesima.',decoys:['x','a'],sym:{}}
};
const ENDING={santuario:'Il portale si apre su una sola lettera, incisa nel metallo: «D».',ultron:'Il codice isolato pronuncia un luogo: «LATVERIA».',simbionte:'La trasmissione si compone: «DOCTOR DOOM».'};
let epId=EP[0].id,roomId=null,solved={},hints={},buf=[],sent=false;
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch{return false}},del(k){try{localStorage.removeItem(k)}catch{}}};
const cur=()=>EP.find(e=>e.id===epId);
const puzzleOf=r=>cur().puzzles.find(p=>p.room_id===r.id);
const avail=p=>(p.prerequisites||[]).every(x=>solved[x]);
const hasFinaleRoom=e=>e.rooms.some(r=>!e.puzzles.some(p=>p.room_id===r.id));
const epDone=id=>{const e=EP.find(x=>x.id===id);const s=id===epId?{solved,sent}:readSaved(id);return e.puzzles.every(p=>s.solved[p.id])&&(!hasFinaleRoom(e)||!!s.sent)};
function el(t,txt,cls){const e=document.createElement(t);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
function say(s){$('status').textContent=s}
function ask(msg,ok){const d=$('tva-dlg');$('tva-dlg-t').textContent=msg;d.classList.add('on');const y=$('tva-dlg-yes'),n=$('tva-dlg-no');const close=()=>{d.classList.remove('on');y.onclick=n.onclick=null;document.removeEventListener('keydown',esc)};const esc=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc);y.onclick=()=>{close();ok()};n.onclick=close;n.focus()}
function readSaved(id){const e=EP.find(x=>x.id===id),out={solved:{},hints:{},room:null,sent:false};
 try{let raw=store.get(KEY(id)),mig=false;if(raw===null){raw=store.get(OLD(id));mig=raw!==null}if(raw===null)return out;let r=JSON.parse(raw);if(!r||typeof r!=='object'||Array.isArray(r))return out;
  const sv=mig?r:(r.solved&&typeof r.solved==='object'?r.solved:{});const hs=!mig&&r.hints&&typeof r.hints==='object'?r.hints:{};
  for(const p of e.puzzles){if(sv[p.id]===true&&(p.prerequisites||[]).every(x=>out.solved[x]))out.solved[p.id]=true;const h=hs[p.id];if(Number.isInteger(h)&&h>=1&&h<=3)out.hints[p.id]=h}
  if(!mig&&r.sent===true&&e.puzzles.every(p=>out.solved[p.id]))out.sent=true;if(!mig&&typeof r.room==='string'&&e.rooms.some(x=>x.id===r.room))out.room=r.room}catch{}return out}
function save(){const ok=store.set(KEY(epId),JSON.stringify({v:2,solved,hints,room:roomId,sent}));if(!ok)say('Salvataggio non disponibile: il progresso resta solo in questa sessione.')}
function loadEp(id,keepRoom){epId=id;const s=readSaved(id);solved=s.solved;hints=s.hints;sent=s.sent;buf=[];const e=cur();roomId=keepRoom&&e.rooms.some(r=>r.id===keepRoom)?keepRoom:(s.room||e.rooms[0].id)}
function tabs(){$('tabs').replaceChildren();for(const e of EP){const b=el('button');b.type='button';const d=epDone(e.id);b.append(el('span',e.title));const n=Object.keys(e.id===epId?solved:readSaved(e.id).solved).length;b.append(document.createElement('br'),el('span',d?'✓ completato':n+'/'+e.puzzles.length,d?'done':''));if(e.id===epId)b.setAttribute('aria-current','true');b.onclick=()=>{loadEp(e.id);say('');render()};$('tabs').append(b)}}
function addHot(scene,r,p){const h=r.hotspots&&r.hotspots[0];if(!h||!p)return;const b=el('button',solved[p.id]?'✓':'⌕','hot'+(solved[p.id]?' done':''));b.type='button';b.setAttribute('aria-label','Esamina: '+p.title);b.style.left=(h.x*100)+'%';b.style.top=(h.y*100)+'%';b.onclick=()=>{const t=$('puzzle');if(t){t.scrollIntoView({behavior:'smooth',block:'start'});t.focus&&t.focus({preventScroll:true})}say('Esamini: '+p.title)};scene.append(b)}
function render(){tabs();const e=cur(),view=$('view');view.replaceChildren();const room=e.rooms.find(r=>r.id===roomId)||e.rooms[0];roomId=room.id;const p=puzzleOf(room);
 const done=e.puzzles.filter(x=>solved[x.id]).length;const all=done===e.puzzles.length;
 const sc=el('section','','scenep');const scene=el('div','','scene');const img=document.createElement('img');img.src='../'+room.background;img.alt='Ambientazione: '+room.name;{const ri=Math.max(0,e.rooms.indexOf(room)),v=ROOMVIEW[ri%ROOMVIEW.length];img.style.objectPosition=v[0];img.style.transformOrigin=v[0];img.style.transform='scale('+v[1]+')'}scene.append(img);
 const top=el('div','','sctop');top.append(el('span',room.name,'rn'),el('span',done+'/'+e.puzzles.length+' enigmi','pg'));scene.append(top);addHot(scene,room,p);
 const ex=el('div','','scex');for(const x of room.exits||[]){const tgt=e.rooms.find(r=>r.id===x.to);const tp=tgt&&puzzleOf(tgt);const b=el('button','→ '+x.label+(tp&&solved[tp.id]?' ✓':''));b.type='button';b.onclick=()=>{roomId=x.to;buf=[];save();say('');render()};ex.append(b)}scene.append(ex);sc.append(scene);view.append(sc);
 if(p){const pn=el('section','','panel');pn.id='puzzle';pn.tabIndex=-1;pn.append(el('h3',p.title));const g=G[p.id]||{};
  if(solved[p.id]){pn.append(el('p','✓ Enigma risolto','ok'))}
  else if(!avail(p)){const miss=p.prerequisites.filter(x=>!solved[x]).map(x=>e.puzzles.find(q=>q.id===x));pn.append(el('p','🔒 Ancora bloccato. Prima risolvi: '+miss.map(q=>q.title).join(' · '),'lock'));const bx=el('div','','row');for(const q of miss){const b=el('button','Vai a «'+q.title+'»');b.type='button';b.onclick=()=>{roomId=q.room_id;buf=[];save();render()};bx.append(b)}pn.append(bx)}
  else{pn.append(el('p',g.clue||p.hint_tiers[0],'clue'));puzzleUI(pn,p,g)}
  view.append(pn)}
 else{const pn=el('section','','panel finale');pn.id='puzzle';pn.tabIndex=-1;if(all){pn.append(el('h3','Trasmettitore'));pn.append(el('p','Tutti i circuiti sono attivi. Il segnale è pronto per essere inviato.'));const b=el('button','Invia il segnale','gold');b.type='button';b.onclick=()=>{sent=true;save();say('Segnale inviato.');render()};if(!sent)pn.append(b)}else{pn.append(el('h3','Trasmettitore'));pn.append(el('p','Silenzio radio. Risolvi tutti gli enigmi dell’episodio per riattivare il trasmettitore.','lock'))}view.append(pn)}
 if(epDone(e.id)){const f=el('section','','panel finale');f.id='ending';f.append(el('h3','Episodio completato'),el('p',ENDING[e.id]||''),el('p','Frammento ricomposto: «'+e.ending_reveal+'»','big'));view.append(f)}
 if(EP.every(x=>epDone(x.id))){const f=el('section','','panel finale');f.id='doom';f.append(el('h3','Finale · Multiverse Escape'),el('p','«D» · «LATVERIA» · «DOCTOR DOOM»','big'),el('p','I tre frammenti compongono una firma sola. Dietro il Santuario infranto, la rivolta di Ultron e l’ombra del Simbionte c’era la stessa mano: Victor von Doom ha cucito le tre crisi in un’unica trappola multiversale. La TVA ha il suo colpevole.'));view.append(f)}}
function puzzleUI(pn,p,g){const sol=p.solution,sym=g.sym||{};const lab=c=>sym[c]||c.toUpperCase();
 if(p.type==='code'){const inp=el('input');inp.inputMode='numeric';inp.pattern='[0-9]*';inp.autocomplete='off';inp.maxLength=String(sol).length;inp.setAttribute('aria-label','Codice di '+String(sol).length+' cifre');inp.placeholder='•'.repeat(String(sol).length);pn.append(inp);const b=el('button','Verifica codice','gold');b.type='button';b.onclick=()=>check(p,inp.value.trim());inp.onkeydown=ev=>{if(ev.key==='Enter')b.click()};const ac=el('div','','acts');ac.append(b,helpBtn(p));pn.append(ac,helpText(p))}
 else if(p.type==='sequence'){const ch=[...new Set(sol),...(g.decoys||[])].sort();const row=el('div','','chips');for(const c of ch){const b=el('button',lab(c));b.type='button';b.onclick=()=>{if(buf.length<sol.length){buf.push(c);render()}};row.append(b)}pn.append(row);const bf=el('div','','buf');bf.setAttribute('aria-live','polite');if(!buf.length)bf.append(el('span','Sequenza: tocca i simboli nell’ordine giusto','lock'));buf.forEach(c=>bf.append(el('b',lab(c))));pn.append(bf);const r2=el('div','','acts');const v=el('button','Verifica','gold');v.type='button';v.disabled=buf.length!==sol.length;v.onclick=()=>check(p,buf.slice());const u=el('button','↶','ic');u.type='button';u.setAttribute('aria-label','Annulla ultimo simbolo');u.disabled=!buf.length;u.onclick=()=>{buf.pop();render()};const c=el('button','✕','ic');c.type='button';c.setAttribute('aria-label','Cancella sequenza');c.disabled=!buf.length;c.onclick=()=>{buf=[];render()};r2.append(v,u,c);r2.append(helpBtn(p));pn.append(r2);pn.append(helpText(p))}
 else{const ch=[...new Set(sol),...(g.decoys||[])].sort();const row=el('div','','chips');for(const c of ch){const on=buf.includes(c);const b=el('button',(on?'✓ ':'')+lab(c),on?'sel':'');b.type='button';b.setAttribute('aria-pressed',String(on));b.onclick=()=>{buf=on?buf.filter(x=>x!==c):[...buf,c];render()};row.append(b)}pn.append(row);const v=el('button','Combina','gold');v.type='button';v.disabled=!buf.length;v.onclick=()=>check(p,buf.slice());const ac=el('div','','acts');ac.append(v,helpBtn(p));pn.append(ac,helpText(p))}}
function helpBtn(p){const n=hints[p.id]||0;const b=el('button',n>=3?'Aiuti 3/3':'Aiuto '+(n+1)+'/3','ghost');b.type='button';b.disabled=n>=3;b.onclick=()=>{hints[p.id]=n+1;save();render()};return b}
function helpText(p){const n=hints[p.id]||0;const box=el('div','','hints');box.setAttribute('aria-live','polite');for(let i=0;i<n;i++){const q=el('p');q.append(el('b','Aiuto '+(i+1)+': '),document.createTextNode(p.hint_tiers[i]));box.append(q)}return box}
function check(p,v){let ok;if(typeof p.solution==='string')ok=v===p.solution;else if(p.type==='combine')ok=Array.isArray(v)&&v.length===p.solution.length&&p.solution.every(x=>v.includes(x));else ok=JSON.stringify(v)===JSON.stringify(p.solution);
 if(ok){solved[p.id]=true;buf=[];save();say('Enigma risolto! Progresso salvato.');render()}else{say('Soluzione non corretta. Riprova: nessuna penalità.');const pn=$('puzzle');if(pn){pn.classList.remove('shake');void pn.offsetWidth;pn.classList.add('shake')}}}
$('reset').onclick=()=>ask('Azzerare i progressi di «'+cur().title+'»? L’operazione non si può annullare.',()=>{store.del(KEY(epId));store.del(OLD(epId));loadEp(epId);say('Episodio azzerato.');render()});
warm(EP.flatMap(e=>e.rooms.map(r=>'../'+r.background)));loadEp(epId);render();
</script></body></html>
