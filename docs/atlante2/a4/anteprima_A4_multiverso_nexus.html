.btn.o{background:transparent;color:var(--amber)}

.leg{display:flex;flex-wrap:wrap;gap:10px;padding:8px 16px;font-size:11px;color:var(--soft)}
.leg i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.trail{display:flex;gap:6px;flex-wrap:wrap;padding:2px 16px 6px;font-size:11.5px;color:var(--soft)}
.trail button{background:none;border:0;color:var(--gold);font:inherit;text-decoration:underline;min-height:32px;padding:0 2px}
select{min-height:46px;width:100%;border-radius:23px;border:1px solid var(--line);background:#14100a;color:var(--text);padding:0 14px;font:500 13px Inter,sans-serif}
ol.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}

footer{padding:14px 16px 28px;font-size:11.5px;color:var(--soft)}
