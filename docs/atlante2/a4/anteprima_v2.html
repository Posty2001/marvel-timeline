<html lang="it"><head><meta charset="utf-8">

<title>Atlante A4 – Osservatorio Multiverso e Nexus (anteprima v2)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#0b0906;--paper:#1c1812;--line:#4a3f2f;--text:#ede0c0;--soft:#b8a888;--gold:#E3C79B;--amber:#F59A23;--teal:#4fa89e;--vio:#b48ae0;--rose:#ff8a8d;--warn:#ffcf70}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#07050a}
body{margin:0;color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;background:#07050a;padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:radial-gradient(110% 40% at 50% -6%,#3a2a10 0%,var(--ink) 62%);position:relative}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
header{padding:12px 16px 4px}
.kick{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.26em;color:var(--amber);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.kick i{font-style:normal;color:var(--soft)}
h1{margin:4px 0 0;font:700 25px/1.08 Spectral,Georgia,serif;color:#f6ecd2}
.sub{font-size:12px;color:var(--soft);margin-top:2px}
.seg{display:flex;margin:10px 16px 6px;border:1px solid var(--line);border-radius:23px;overflow:hidden;background:rgba(20,16,10,.85)}
.seg button{flex:1;min-height:46px;border:0;background:none;color:var(--soft);font:600 12.5px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected=true]{background:var(--amber);color:#1a1208}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 6px;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 13px;border-radius:22px;border:1px solid var(--line);background:rgba(30,25,18,.9);color:var(--text);font:500 12px Inter,sans-serif;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1a1208;font-weight:600}
.chip .sw{width:24px;height:16px;border-radius:8px;background:#120d07;display:inline-flex;align-items:center;justify-content:center}.chip .sw i{display:block;width:16px;height:0;border-top:2.5px solid}
.lbl{white-space:nowrap;flex:none;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);padding:0 16px}
.stage{position:relative;margin:4px 8px 0;border:1px solid var(--line);border-radius:20px;background:#0a0805;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage svg{display:block;width:100%;height:100%}
.stage.fs{position:fixed;inset:0;margin:0;border-radius:0;z-index:60;padding-top:env(safe-area-inset-top)}
.tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.tb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(14,11,8,.82);color:var(--gold);font:600 18px Inter,sans-serif;display:flex;align-items:center;justify-content:center;padding:0}
.hud{position:absolute;left:10px;top:8px;z-index:3;font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--soft);text-transform:uppercase;pointer-events:none;line-height:1.5}
.hud b{color:var(--amber);font-weight:500}
.node{cursor:pointer;outline:none}
.node:focus-visible .ring{stroke:#fff;stroke-width:3}
.t{font:500 10px Inter,sans-serif;fill:var(--text);paint-order:stroke;stroke:#0a0805;stroke-width:3.2px;pointer-events:none}
.t.m{font:500 8.5px 'IBM Plex Mono',monospace;fill:var(--soft);letter-spacing:.08em}
.sheet{margin:10px 8px 0;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,rgba(46,37,26,.92),rgba(22,18,13,.96));padding:14px;display:flex;flex-direction:column;gap:9px}
.sheet h2{margin:0;font:700 20px/1.1 Spectral,serif;color:var(--gold)}
.sheet .hd{display:flex;gap:12px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;border:1px solid currentColor;font:500 10.5px Inter,sans-serif;letter-spacing:.03em;white-space:nowrap}
.pill.ver{color:#8fd6a8}.pill.gui{color:var(--gold)}.pill.dv{color:var(--warn);border-style:dashed}
.note{font-size:12px;color:var(--soft)}
.btn{min-height:46px;border-radius:23px;border:1px solid var(--amber);background:var(--amber);color:#1a1208;font:600 13px Inter,sans-serif;padding:0 18px;flex:1}
.btn.o{background:transparent;color:var(--amber)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{border:1px solid var(--line);border-radius:12px;padding:8px;background:rgba(12,9,6,.5)}
.kv b{display:block;font:700 18px Spectral,serif;color:var(--gold)}
.kv span{font-size:10.5px;color:var(--soft)}
input[type=search],select{min-height:46px;width:100%;border-radius:23px;border:1px solid var(--line);background:#120e09;color:var(--text);padding:0 16px;font:500 14px Inter,sans-serif}
.res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#120e09}
.res[hidden]{display:none}.res button{min-height:44px;border:0;border-bottom:1px solid #2a2218;background:none;color:var(--text);text-align:left;padding:6px 14px;font:500 13px Inter,sans-serif;display:flex;justify-content:space-between;gap:8px}
.res button small{color:var(--soft);font-size:11px;white-space:nowrap}
.trail{display:flex;gap:4px;flex-wrap:wrap;padding:6px 16px 0;font-size:12px;color:var(--soft);align-items:center}
.trail button{background:none;border:0;color:var(--gold);font:inherit;text-decoration:underline;min-height:36px;padding:0 3px}
.legend{margin:8px 8px 0;border:1px solid var(--line);border-radius:16px;background:rgba(18,14,9,.7)}
.legend summary{min-height:44px;display:flex;align-items:center;padding:0 14px;cursor:pointer;font:500 12px Inter,sans-serif;color:var(--gold)}
.legend .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:2px 14px 12px;font-size:11.5px;color:var(--soft)}
.legend .g div{display:flex;align-items:center;gap:8px}
.legend svg{width:34px;height:10px;flex:none}
ol.path{list-style:none;margin:0;padding:0}
.step{display:flex;gap:10px}
.step .rail{display:flex;flex-direction:column;align-items:center;width:34px;flex:none}
.step .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--amber);background:#150f08;display:flex;align-items:center;justify-content:center;font:600 11px 'IBM Plex Mono',monospace;color:var(--gold)}
.step .bar{flex:1;width:0;border-left:2px dotted var(--line);min-height:14px}
.step .body{flex:1;min-width:0;padding-bottom:10px}
.link{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:2px 0 8px;background:rgba(12,9,6,.55);font-size:12px;color:var(--soft);display:flex;flex-direction:column;gap:5px}
.link b{color:var(--text);font-weight:600}
footer{padding:14px 16px 30px;font-size:11.5px;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#241c11;border:1px solid var(--amber);color:var(--text);border-radius:14px;padding:10px 14px;font-size:12px;max-width:380px;z-index:80}
@keyframes sweep{to{transform:rotate(360deg)}}
.sweepg{transform-origin:0 0;animation:sweep 28s linear infinite}
@keyframes pulse{50%{opacity:.55}}
.pulse{animation:pulse 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sweepg,.pulse{animation:none}}
</style></head><body>
