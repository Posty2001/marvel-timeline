# TVA Live - scheduler giornaliero. Repository: tva-live-scheduler (pubblico, branch predefinito: main).
# Fa UNA cosa: avvia l aggiornamento del catalogo sul branch TEST di marvel-timeline, ne attende l esito e lo verifica.
# Non contiene codice dell app, non pubblica nulla (la pubblicazione dei JSON e una fase successiva, separata) e non tocca mai main.
name: TVA Live - scheduler
run-name: TVA Live scheduler (${{ github.event_name }})

on:
  schedule:
    - cron: '17 5 * * *'            # una volta al giorno (UTC), minuto non tondo per evitare i picchi di GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prova a secco - esegue tutti i controlli ma non scrive e non fa commit
        type: boolean
        default: false
      publish_only:
        description: RECUPERO - non rigenera nulla - ripubblica il catalogo GIA presente sul branch TEST (dopo un ripristino con live_recover_from)
        type: boolean
        default: false

permissions: {}                     # nessun permesso di default; ogni job dichiara solo il necessario

concurrency:
  group: tva-live-scheduler
  cancel-in-progress: false

env:
  TARGET_REPO: Posty2001/marvel-timeline
  TARGET_REF: test/tva-archives     # unico branch ammesso; non e un input, non si puo cambiare dall esterno
  TARGET_WORKFLOW: tmdb-sync.yml

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}                 # nessun checkout, nessun GITHUB_TOKEN: si usa solo il token fine-grained (Actions: Read and write)
    outputs:
      outcome: ${{ steps.run.outputs.outcome }}
      verified: ${{ steps.run.outputs.verified }}
      content_hash: ${{ steps.run.outputs.content_hash }}
      head_sha: ${{ steps.run.outputs.head_sha }}
    steps:
      - name: Avvia, attendi e verifica l aggiornamento
        id: run
        env:
          GH_TOKEN: ${{ secrets.TVA_DISPATCH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          PUBLISH_ONLY: ${{ inputs.publish_only == true && 'true' || 'false' }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; { echo "outcome=${2:-error}"; echo "verified=false"; } >> "$GITHUB_OUTPUT"; summary "ERRORE" "$1"; exit 1; }
          summary() { { echo "## TVA Live - scheduler"; echo; echo "**Esito: $1**"; echo; echo "$2"; echo; echo "- Repository: \`$TARGET_REPO\`, branch \`$TARGET_REF\`"; echo "- Prova a secco: $DRY_RUN"; [ -n "${RUN_URL:-}" ] && echo "- Run: $RUN_URL"; [ -n "${HASH:-}" ] && echo "- Contenuto (hash): \`$HASH\`"; } >> "$GITHUB_STEP_SUMMARY"; }

          [ -n "${GH_TOKEN:-}" ] || fail "Secret TVA_DISPATCH_TOKEN mancante: crealo in Settings > Secrets and variables > Actions."
          main_before="$(gh api "repos/$TARGET_REPO/commits/main" --jq .sha)" || fail "Token non valido o scaduto, oppure repository non raggiungibile."
          head_before="$(gh api "repos/$TARGET_REPO/commits/$TARGET_REF" --jq .sha)" || fail "Branch $TARGET_REF non raggiungibile."

          # 0) RECUPERO: nessuna rigenerazione. Si pubblica il catalogo che il branch TEST contiene gia, solo se manifest e status.json sono coerenti tra loro.
          if [ "$PUBLISH_ONLY" = "true" ]; then
            rd0() { gh api "repos/$TARGET_REPO/contents/assets/live/$1?ref=$head_before" --jq .content | base64 -d; }
            bh="$(rd0 manifest.json | jq -r '.content_hash // ""')" || bh=""
            sh="$(rd0 status.json | jq -r '.content_hash // ""')" || sh=""
            [ -n "$bh" ] && [ "$bh" = "$sh" ] || fail "Recupero: manifest ($bh) e status.json ($sh) non coerenti sul branch. Nulla pubblicato."
            echo "outcome=republish" >> "$GITHUB_OUTPUT"; echo "content_hash=$bh" >> "$GITHUB_OUTPUT"
            if [ "$DRY_RUN" = "true" ]; then echo "verified=false" >> "$GITHUB_OUTPUT"; summary "PROVA A SECCO: ripubblicazione" "Dati coerenti (hash $bh). Nulla pubblicato (prova a secco)."; exit 0; fi
            [ "$(gh api "repos/$TARGET_REPO/commits/main" --jq .sha)" = "$main_before" ] || fail "main e cambiato durante l esecuzione: verificare subito."
            echo "verified=true" >> "$GITHUB_OUTPUT"; echo "head_sha=$head_before" >> "$GITHUB_OUTPUT"
            summary "RIPUBBLICAZIONE" "Ripubblicato il catalogo gia presente sul branch TEST (hash $bh), senza rigenerarlo. L app lo accetta solo se il suo generated_at e piu recente di quello gia visto."; exit 0
          fi

          # 1) Avvio, con identificativo di correlazione (nome del run) per ritrovare esattamente questo run.
          did="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="TVA Live update $did"
          gh workflow run "$TARGET_WORKFLOW" -R "$TARGET_REPO" --ref "$TARGET_REF" \
            -f solo_live_build=true -f live_commit=true -f live_dry_run="$DRY_RUN" -f dispatch_id="$did" \
            || fail "Avvio del workflow rifiutato (token senza permesso Actions: Read and write, o workflow non trovato)."
          id=""
          for i in $(seq 1 18); do
            sleep 10
            id="$(gh run list -R "$TARGET_REPO" -w "$TARGET_WORKFLOW" --branch "$TARGET_REF" --event workflow_dispatch --limit 20 \
                  --json databaseId,displayTitle --jq "[.[] | select(.displayTitle == \"$title\")][0].databaseId // empty" 2>/dev/null)"
            [ -n "$id" ] && break
          done
          [ -n "$id" ] || fail "Run di aggiornamento non trovato entro 3 minuti."
          RUN_URL="https://github.com/$TARGET_REPO/actions/runs/$id"; echo "Run: $RUN_URL"

          # 2) Attesa dell esito effettivo (massimo 15 minuti).
          status=""; conclusion=""
          for i in $(seq 1 60); do
            read -r status conclusion < <(gh run view "$id" -R "$TARGET_REPO" --json status,conclusion --jq '[.status, (.conclusion // "-")] | @tsv' 2>/dev/null || echo "unknown -")
            [ "$status" = "completed" ] && break
            sleep 15
          done
          [ "$status" = "completed" ] || fail "Il run non e terminato entro 15 minuti (stato: $status)."
          echo "Conclusione del run: $conclusion"

          # 3) Esito leggibile da macchina (artifact del run: nessun token dentro, non viene ripubblicato).
          dir="$(mktemp -d)"
          gh run download "$id" -R "$TARGET_REPO" -n tva-live-update -D "$dir" >/dev/null 2>&1 || true
          [ -s "$dir/RESULT.json" ] || fail "Nessun RESULT.json: generazione fallita prima della decisione (conclusione del run: $conclusion)."
          outcome="$(jq -r '.result' "$dir/RESULT.json")"
          HASH="$(jq -r '.content_hash // ""' "$dir/RESULT.json")"
          case "$outcome" in unchanged|heartbeat|update|rejected) ;; *) fail "Esito sconosciuto nel RESULT.json: $outcome" ;; esac
          reasons="$(jq -r '(.blocking + .warnings) | map("- " + .) | join("\n")' "$dir/RESULT.json")"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"; echo "content_hash=$HASH" >> "$GITHUB_OUTPUT"

          # 4) Controlli di coerenza: main intatto, esito coerente con la conclusione del run, branch coerente con l esito.
          [ "$(gh api "repos/$TARGET_REPO/commits/main" --jq .sha)" = "$main_before" ] || fail "main e cambiato durante l esecuzione: verificare subito." 
          if [ "$outcome" = "rejected" ]; then
            echo "verified=false" >> "$GITHUB_OUTPUT"
            summary "RIFIUTATO" "L aggiornamento e stato bloccato dai controlli e NON e stato scritto. Il catalogo valido precedente resta invariato.
          $reasons"
            echo "::error::Aggiornamento rifiutato dai controlli di qualita (vedi riepilogo)."; exit 1
          fi
          [ "$conclusion" = "success" ] || fail "Esito $outcome ma il run e terminato con '$conclusion' (commit non riuscito?). Nulla da pubblicare." "$outcome"

          head_after="$(gh api "repos/$TARGET_REPO/commits/$TARGET_REF" --jq .sha)"
          if [ "$DRY_RUN" = "true" ]; then
            [ "$head_after" = "$head_before" ] || fail "Prova a secco ma il branch e cambiato."
            echo "verified=false" >> "$GITHUB_OUTPUT"      # in prova a secco non si pubblica mai nulla
            summary "PROVA A SECCO: $outcome" "Nessuna scrittura (come previsto).
          $reasons"; exit 0
          fi
          rd() { gh api "repos/$TARGET_REPO/contents/assets/live/$1?ref=$head_after" --jq .content | base64 -d; }
          bh="$(rd manifest.json | jq -r '.content_hash // ""')" || bh=""
          [ -n "$HASH" ] && [ "$bh" = "$HASH" ] || fail "Il manifest sul branch ($bh) non corrisponde al contenuto validato ($HASH)." "$outcome"
          if [ "$outcome" = "update" ] || [ "$outcome" = "heartbeat" ]; then
            [ "$(rd status.json | jq -r '.content_hash + "|" + .result')" = "$HASH|$outcome" ] || fail "status.json sul branch non registra l esito $outcome." "$outcome"
          elif [ "$head_after" != "$head_before" ]; then
            echo "::notice::Il branch e avanzato durante il run (altro commit), il catalogo e comunque coerente."
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"; echo "head_sha=$head_after" >> "$GITHUB_OUTPUT"     # i dati verificati sono quelli di QUESTO commit
          case "$outcome" in
            unchanged) m="Catalogo invariato: nessun commit (comportamento corretto)." ;;
            heartbeat) m="Contenuto identico: registrata soltanto la verifica periodica." ;;
            update)    m="Catalogo aggiornato e registrato sul branch TEST." ;;
          esac
          summary "$(echo "$outcome" | tr a-z A-Z)" "$m
          $reasons"

  publish:
    # Pubblica SOLO dati verificati: rivalida in modo indipendente, registra una versione immutabile in catalog/ (Git) e prepara il sito.
    if: ${{ needs.update.outputs.verified == 'true' && github.ref == 'refs/heads/main' }}
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write               # solo per registrare catalog/ in QUESTO repository
    outputs:
      deploy: ${{ steps.pub.outputs.deploy }}
      version: ${{ steps.pub.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Dati verificati (SHA fissato del branch TEST, sola lettura, repository pubblico)
        uses: actions/checkout@v4
        with:
          repository: Posty2001/marvel-timeline
          ref: ${{ needs.update.outputs.head_sha }}
          path: src
          sparse-checkout: assets/live
          persist-credentials: false
      - name: Valida, registra la versione e costruisci il sito
        id: pub
        run: |
          python3 scripts/publish_catalog.py --src src/assets/live --store catalog --site _site \
            --live-pointer "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/v1/current.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Registra la versione nel repository (solo se nuova)
        run: |
          git config user.name "tva-live-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          if git diff --cached --quiet; then echo "Nessuna nuova versione da registrare."; else
            git commit -q -m "catalogo ${{ steps.pub.outputs.version }}"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
          fi
      - name: Prepara il sito per GitHub Pages
        if: ${{ steps.pub.outputs.deploy == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ needs.publish.outputs.deploy == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  verify-endpoint:
    # Misura l endpoint PUBBLICO reale (HTTPS, CORS, cache, tipo, integrita) e rende rosso lo scheduler se qualcosa non va.
    if: ${{ needs.deploy.result == 'success' }}
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verifica endpoint
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          ORIGIN: https://tva-archives-test-1110.netlify.app
        run: |
          set -uo pipefail
          B="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          bad=0; err() { echo "::error::$1"; bad=1; }
          hv() { grep -i "^$1:" "$2" | head -1 | tr -d '\r' || true; }
          ok=0
          for i in $(seq 1 18); do
            curl -sS --max-time 20 -D h.txt -H "Origin: $ORIGIN" -o cur.json "$B/v1/current.json" 2>/dev/null
            if [ "$(head -1 h.txt | cut -d' ' -f2)" = "200" ] && [ "$(jq -r .version cur.json 2>/dev/null)" = "$VERSION" ]; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::Il puntatore pubblicato non mostra la versione $VERSION entro 3 minuti."; exit 1; }
          { echo "## Endpoint TVA Live"; echo; echo "URL: \`$B/v1/current.json\` - versione \`$VERSION\`"; echo; echo '```'; sed -n '1p' h.txt | tr -d '\r'; for h in content-type access-control-allow-origin cache-control etag last-modified age server via; do hv $h h.txt; done; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          hv access-control-allow-origin h.txt | grep -qiE ': (\*|'"$ORIGIN"')$' || err "CORS assente o ristretto: manca Access-Control-Allow-Origin per $ORIGIN"
          hv content-type h.txt | grep -qi 'json' || err "Content-Type non JSON"
          for n in calendar trailers manifest; do
            path="$(jq -r ".files.$n.path" cur.json)"; want="$(jq -r ".files.$n.sha256" cur.json)"
            curl -sS --max-time 20 -D hf.txt -H "Origin: $ORIGIN" -o f.json "$B/v1/$path" || err "$n non raggiungibile"
            [ "$(sha256sum f.json | cut -d' ' -f1)" = "$want" ] || err "$n: sha256 diverso dal puntatore"
            hv access-control-allow-origin hf.txt | grep -qiE ': (\*|'"$ORIGIN"')$' || err "$n: CORS assente"
            { echo; echo "- \`$path\`: $(hv cache-control hf.txt)"; } >> "$GITHUB_STEP_SUMMARY"
          done
          loc="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' "http://${B#https://}/v1/current.json")"
          case "$loc" in 301*https://*|302*https://*|308*https://*) ;; *) err "HTTP non reindirizzato a HTTPS ($loc)";; esac
          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$B/status.json")"; [ "$code" = 404 ] || err "file interno raggiungibile (status.json: $code)"
          exit $bad

  keepalive:
    # Evita la disattivazione dei cron dopo 60 giorni senza attivita nel repository scheduler. Parte anche se l aggiornamento fallisce.
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [update, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write               # solo per il file .keepalive di QUESTO repository
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive mensile
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%d > .keepalive
            git config user.name "tva-live-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git diff --cached --quiet || { git commit -q -m "keepalive"; git pull -q --rebase origin main; git push -q; }
          fi
